<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title description">
  <title id="title">Gymni deployment technology and traffic architecture</title>
  <desc id="description">Terraform deploys separate website, API and Varnish ingress Compose projects to an existing Ubuntu VPS over SSH. Browser requests for the website and API travel over HTTPS through Caddy and Varnish to separate private containers. FastAPI reads and writes PostgreSQL. Website caching is disabled by default.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161721"/>
      <stop offset="1" stop-color="#101218"/>
    </linearGradient>
    <linearGradient id="client" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#29263d"/>
      <stop offset="1" stop-color="#201e30"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#332d23"/>
      <stop offset="1" stop-color="#27231d"/>
    </linearGradient>
    <linearGradient id="service" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19322e"/>
      <stop offset="1" stop-color="#192722"/>
    </linearGradient>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a397ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#73d8b2"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8bd78"/>
    </marker>
    <style>
      .title { font: 700 29px system-ui, sans-serif; fill: #f1f0f8; }
      .subtitle { font: 14px system-ui, sans-serif; fill: #a2a3b0; }
      .section { font: 700 12px system-ui, sans-serif; letter-spacing: 1.8px; fill: #a397ff; }
      .section-green { font: 700 12px system-ui, sans-serif; letter-spacing: 1.8px; fill: #73d8b2; }
      .section-gold { font: 700 12px system-ui, sans-serif; letter-spacing: 1.8px; fill: #e8bd78; }
      .box-title { font: 700 16px system-ui, sans-serif; fill: #f1f0f8; }
      .box-copy { font: 12px system-ui, sans-serif; fill: #b1b1bf; }
      .label { font: 11px system-ui, sans-serif; fill: #c3bbff; }
      .label-green { font: 11px system-ui, sans-serif; fill: #9de3c7; }
      .label-gold { font: 11px system-ui, sans-serif; fill: #f0d7a8; }
      .small { font: 11px system-ui, sans-serif; fill: #898b9c; }
    </style>
  </defs>
  <rect width="1440" height="920" rx="20" fill="url(#background)"/>
  <text x="64" y="66" class="title">Gymni deployment: technologies and traffic paths</text>
  <text x="64" y="95" class="subtitle">Separate containers and Terraform modules, joined by private Docker networking on the existing VPS.</text>

  <rect x="50" y="126" width="1340" height="145" rx="20" fill="#1c1b20" stroke="#514638"/>
  <text x="76" y="158" class="section-gold">INFRASTRUCTURE DEPLOYMENT · CONTROL PLANE</text>
  <rect x="82" y="180" width="260" height="66" rx="13" fill="url(#edge)" stroke="#806943"/>
  <text x="103" y="207" class="box-title">Terraform runner</text>
  <text x="103" y="229" class="box-copy">Root config · SSH provisioners</text>
  <rect x="470" y="180" width="390" height="66" rx="13" fill="#252127" stroke="#665a9f"/>
  <text x="493" y="207" class="box-title">Three deployment modules</text>
  <text x="493" y="229" class="box-copy">Backend · Website · Varnish ingress</text>
  <rect x="1015" y="180" width="335" height="66" rx="13" fill="#202c28" stroke="#4a7967"/>
  <text x="1038" y="207" class="box-title">Existing Ubuntu VPS</text>
  <text x="1038" y="229" class="box-copy">Docker Engine · Docker Compose</text>
  <path d="M342 213 H462" fill="none" stroke="#e8bd78" stroke-width="2.5" marker-end="url(#arrow-gold)"/>
  <text x="363" y="202" class="label-gold">module config</text>
  <path d="M860 213 H1007" fill="none" stroke="#e8bd78" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow-gold)"/>
  <text x="883" y="202" class="label-gold">SSH · deploy / update</text>

  <rect x="50" y="300" width="330" height="490" rx="20" fill="#171821" stroke="#38344e"/>
  <text x="76" y="334" class="section">CLIENT · USER'S DEVICE</text>
  <rect x="82" y="366" width="266" height="125" rx="14" fill="url(#client)" stroke="#665a9f"/>
  <text x="105" y="398" class="box-title">Web browser</text>
  <text x="105" y="423" class="box-copy">HTML · CSS · JavaScript</text>
  <text x="105" y="445" class="box-copy">Gymni UI and API client</text>
  <text x="105" y="467" class="box-copy">Loads config.js API base URL</text>
  <rect x="82" y="547" width="266" height="120" rx="14" fill="#22212f" stroke="#665a9f"/>
  <text x="105" y="580" class="box-title">Two HTTPS destinations</text>
  <text x="105" y="605" class="box-copy">Website hostname: load the UI</text>
  <text x="105" y="627" class="box-copy">API hostname: send REST / JSON</text>
  <text x="76" y="733" class="small">The browser calls the API directly; it is not</text>
  <text x="76" y="751" class="small">proxied through the website container.</text>

  <rect x="420" y="300" width="970" height="490" rx="20" fill="#151a19" stroke="#31423b"/>
  <text x="448" y="334" class="section-green">VPS · PRIVATE DOCKER NETWORK: gymni</text>

  <rect x="468" y="408" width="205" height="130" rx="14" fill="url(#edge)" stroke="#806943"/>
  <text x="490" y="442" class="box-title">Caddy 2</text>
  <text x="490" y="468" class="box-copy">Public ports 80 / 443</text>
  <text x="490" y="490" class="box-copy">TLS certificates · HTTPS</text>
  <text x="490" y="512" class="box-copy">Reverse proxy to Varnish</text>

  <rect x="748" y="408" width="215" height="130" rx="14" fill="#28252b" stroke="#806943"/>
  <text x="772" y="442" class="box-title">Varnish 7.6</text>
  <text x="772" y="468" class="box-copy">HTTP routing by hostname</text>
  <text x="772" y="490" class="box-copy">Website → website:5174</text>
  <text x="772" y="512" class="box-copy">API → api:8000</text>

  <rect x="1035" y="365" width="300" height="120" rx="14" fill="url(#service)" stroke="#4a7967"/>
  <text x="1058" y="398" class="box-title">Website container</text>
  <text x="1058" y="423" class="box-copy">Python static HTTP server</text>
  <text x="1058" y="445" class="box-copy">Container port 5174 · no host port</text>
  <text x="1058" y="467" class="box-copy">Serves Gymni-Website files</text>

  <rect x="1035" y="548" width="300" height="132" rx="14" fill="url(#service)" stroke="#4a7967"/>
  <text x="1058" y="581" class="box-title">Backend container</text>
  <text x="1058" y="606" class="box-copy">FastAPI · REST endpoints</text>
  <text x="1058" y="628" class="box-copy">Container port 8000 · no host port</text>
  <text x="1058" y="650" class="box-copy">SQLAlchemy ORM</text>

  <rect x="748" y="690" width="215" height="70" rx="14" fill="#202c28" stroke="#4a7967"/>
  <text x="772" y="719" class="box-title">PostgreSQL 15</text>
  <text x="772" y="742" class="box-copy">Persistent volume · port 5432</text>

  <path d="M348 420 H460" fill="none" stroke="#a397ff" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="365" y="405" class="label">HTTPS · website</text>
  <path d="M348 617 H402 V518 H460" fill="none" stroke="#a397ff" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="365" y="603" class="label">HTTPS · API</text>

  <path d="M673 473 H740" fill="none" stroke="#e8bd78" stroke-width="2.5" marker-end="url(#arrow-gold)"/>
  <text x="678" y="461" class="label-gold">HTTP · private</text>
  <path d="M963 442 H1027" fill="none" stroke="#73d8b2" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="969" y="428" class="label-green">website host</text>
  <path d="M963 500 H992 V614 H1027" fill="none" stroke="#73d8b2" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="970" y="553" class="label-green">API host</text>
  <path d="M1035 652 H1000 V725 H971" fill="none" stroke="#73d8b2" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="1008" y="708" class="label-green">SQL</text>

  <rect x="50" y="815" width="1340" height="75" rx="16" fill="#1c1c26" stroke="#454051"/>
  <text x="76" y="845" class="box-title">Caching and exposure</text>
  <text x="260" y="845" class="box-copy">Varnish website cache is disabled by default; API requests always bypass cache.</text>
  <text x="260" y="868" class="box-copy">Only Caddy publishes ports 80/443. Website 5174 and API 8000 are private container ports; database 5432 is loopback-bound.</text>
</svg>
